name: crDroid Android 11 32-bit Vendor Build

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Prepare local vendor proprietary tree
        run: |
          DEVICE=a02
          VENDOR=samsung
          TARGET_DIR="vendor_a02/$VENDOR/$DEVICE"
          PROP_DIR="$TARGET_DIR/proprietary"

          if [ ! -d "$PROP_DIR" ]; then
            echo "Source proprietary directory not found: $PROP_DIR"
            exit 1
          fi

          echo "Local proprietary tree is ready at $PROP_DIR"

      - name: Generate crDroid 11 vendor makefiles
        run: |
          DEVICE=a02
          VENDOR=samsung
          TARGET_DIR="vendor_a02/$VENDOR/$DEVICE"
          PROP_DIR="$TARGET_DIR/proprietary"

          echo "# Auto-generated by GitHub Actions for crDroid Android 11 32-bit." > "$TARGET_DIR/$DEVICE-vendor.mk"
          echo "PRODUCT_COPY_FILES += \\" >> "$TARGET_DIR/$DEVICE-vendor.mk"
          find "$PROP_DIR" -type f ! -name ".gitkeep" | sort | while read -r f; do
            REL_PATH="${f#$PROP_DIR/}"
            echo "    $f:vendor/$REL_PATH \\" >> "$TARGET_DIR/$DEVICE-vendor.mk"
          done
          sed -i '$ s/ \\\$//' "$TARGET_DIR/$DEVICE-vendor.mk"

          cat > "$TARGET_DIR/Android.mk" <<'EOF'
LOCAL_PATH := $(call my-dir)
ifeq ($(TARGET_DEVICE),a02)
include $(LOCAL_PATH)/a02-vendor.mk
endif
EOF

          cat > "$TARGET_DIR/AndroidProducts.mk" <<'EOF'
PRODUCT_MAKEFILES := \
    $(LOCAL_DIR)/a02-vendor.mk
EOF

          cat > "$TARGET_DIR/BoardConfigVendor.mk" <<EOF
DEVICE_VENDOR_RELEASE_CONFIG_WILDCARD := vendor/$VENDOR/$DEVICE/configs/*.xml
TARGET_ARCH_VARIANT := arm
EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Generate crDroid Android 11 32-bit vendor tree for A02"
            git push origin main
          fi
