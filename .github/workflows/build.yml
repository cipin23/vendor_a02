name: Build Vendor Image

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub Release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  IMAGE_LABEL: vendor
  FS_TYPE: ext4

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install Dependencies
      shell: bash
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          e2fsprogs \
          dosfstools \
          android-sdk-libsparse-utils \
          zip \
          unzip \
          tree \
          rsync \
          file

        which mkfs.ext4
        which resize2fs
        which e2fsck
        which img2simg || true

    - name: Detect Repository Layout
      id: detect
      shell: bash
      run: |

        ROOT="$GITHUB_WORKSPACE"

        echo "Workspace : $ROOT"

        if [ -d "$ROOT/samsung/a02/proprietary" ]; then
            DEVICE_ROOT="$ROOT/samsung/a02"
        elif [ -d "$ROOT/vendor_a02/samsung/a02/proprietary" ]; then
            DEVICE_ROOT="$ROOT/vendor_a02/samsung/a02"
        elif [ -d "$ROOT/vendor/samsung/a02/proprietary" ]; then
            DEVICE_ROOT="$ROOT/vendor/samsung/a02"
        else
            echo "Unable to locate proprietary folder."
            find "$ROOT" -maxdepth 5 -type d
            exit 1
        fi

        PROP="$DEVICE_ROOT/proprietary"

        echo "DEVICE_ROOT=$DEVICE_ROOT" >> $GITHUB_ENV
        echo "PROP=$PROP" >> $GITHUB_ENV

        echo "Device root : $DEVICE_ROOT"
        echo "Blob path   : $PROP"

        test -d "$PROP"

        FILES=$(find "$PROP" -type f | wc -l)

        echo "Blob files : $FILES"

        if [ "$FILES" = "0" ]; then
            echo "No proprietary blobs found."
            exit 1
        fi

    - name: Calculate Image Size
      shell: bash
      run: |

        SIZE=$(du -sb "$PROP" | awk '{print $1}')

        echo "Blob bytes : $SIZE"

        EXTRA=$((64*1024*1024))

        IMG_SIZE=$((SIZE+EXTRA))

        BLOCK=4096

        IMG_SIZE=$(( (IMG_SIZE + BLOCK -1)/BLOCK*BLOCK ))

        echo "IMG_SIZE=$IMG_SIZE" >> $GITHUB_ENV

        echo "Image size : $IMG_SIZE"

    - name: Create Empty Image
      shell: bash
      run: |

        truncate -s "$IMG_SIZE" vendor.img

        mkfs.ext4 \
          -F \
          -L vendor \
          vendor.img

    - name: Mount Image
      shell: bash
      run: |

        mkdir image

        sudo mount \
            -o loop \
            vendor.img \
            image

    - name: Copy Proprietary Files
      shell: bash
      run: |

        echo "Copying proprietary blobs..."

        sudo rsync \
            -aH \
            "$PROP"/ \
            image/

        sync

        echo "Vendor content"

        sudo find image | head -200

    - name: Unmount Image
      if: always()
      shell: bash
      run: |

        sync

        sudo umount image || true

        rmdir image || true

    - name: Filesystem Check
      shell: bash
      run: |

        e2fsck -fy vendor.img

        resize2fs -M vendor.img

        e2fsck -fy vendor.img

    - name: Generate Sparse Image
      shell: bash
      run: |

        if command -v img2simg >/dev/null 2>&1; then
            img2simg vendor.img vendor_sparse.img
        else
            cp vendor.img vendor_sparse.img
        fi

    - name: Show Image Information
      shell: bash
      run: |
        echo "===== FILE ====="
        ls -lh vendor.img vendor_sparse.img

        echo
        echo "===== FILESYSTEM ====="
        sudo dumpe2fs -h vendor.img | head -80 || true

        echo
        echo "===== IMAGE SIZE ====="
        du -h vendor.img vendor_sparse.img

    - name: Create Flashable Package
      shell: bash
      run: |

        mkdir output

        cp vendor.img output/
        cp vendor_sparse.img output/

        cat > output/README.txt <<EOF
        Samsung Galaxy A02 Vendor Image

        Repository:
        ${{ github.repository }}

        Branch:
        ${{ github.ref_name }}

        Commit:
        ${{ github.sha }}

        Build Time:
        $(date -u)

        Generated by GitHub Actions
        EOF

        cd output

        zip -9 -r ../vendor.zip .

        cd ..

        ls -lh vendor.zip

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vendor-build
        path: |
          vendor.img
          vendor_sparse.img
          vendor.zip
        if-no-files-found: error
        retention-days: 30

    - name: Create Release
      if: github.event.inputs.release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: vendor-${{ github.run_number }}
        name: Vendor Image Build #${{ github.run_number }}
        generate_release_notes: true
        files: |
          vendor.img
          vendor_sparse.img
          vendor.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        sudo umount image 2>/dev/null || true

        sudo losetup -D || true

        rm -rf image output || true

        ls -lh
