name: Build Vendor Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs dosfstools zip unzip rsync tree file
      - name: Detect proprietary
        run: |
          set -e
          for d in samsung/a02/proprietary vendor/samsung/a02/proprietary vendor_a02/samsung/a02/proprietary; do
            if [ -d "$d" ]; then PROP="$d"; break; fi
          done
          test -n "$PROP"
          echo "PROP=$PROP" >> $GITHUB_ENV
      - name: Calculate size
        run: |
          SIZE=$(du -sb "$PROP"|cut -f1)
          EXTRA=$((64*1024*1024))
          IMG=$((SIZE+EXTRA))
          IMG=$((((IMG+4095)/4096)*4096))
          echo "IMG=$IMG" >> $GITHUB_ENV
      - name: Create image
        run: |
          truncate -s "$IMG" vendor.img
          mkfs.ext4 -F -L vendor vendor.img
      - name: Mount
        run: |
          sudo mkdir -p /mnt/vendorimg
          sudo mount -o loop vendor.img /mnt/vendorimg
      - name: Copy
        run: |
          sudo rsync -aHAX "$PROP"/ /mnt/vendorimg/
          sync
      - name: Unmount
        if: always()
        run: |
          sync
          sudo umount /mnt/vendorimg || true
      - name: Fsck
        run: e2fsck -fy vendor.img
      - name: Zip
        run: |
          mkdir out
          cp vendor.img out/
          cd out && zip -r ../vendor.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: vendor-build
          path: |
            vendor.img
            vendor.zip
