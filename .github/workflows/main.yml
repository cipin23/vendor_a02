name: Auto Generate Vendor Tree A02 (Simple Mode)

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vendor Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Download and Unpack Vendor Dump
        run: |
          curl -L "https://github.com/rdbckp/vendor/raw/main/vendor.tar.gz" -o vendor_dump.tar.gz
          mkdir -p dump_folder
          tar -xzpf vendor_dump.tar.gz -C dump_folder/

      - name: Manual Extraction & Makefile Generator
        run: |
          DEVICE=a02
          VENDOR=samsung
          TARGET_DIR="vendor/$VENDOR/$DEVICE"
          PROP_DIR="$TARGET_DIR/proprietary"
          
          mkdir -p "$PROP_DIR"

          # 1. Daftar file yang mau diambil
          FILES=(
            "vendor/lib/hw/gralloc.mt6739.so"
            "vendor/lib/hw/hwcomposer.mt6739.so"
            "vendor/lib/libgralloc_extra.so"
            "vendor/bin/hw/android.hardware.audio.service"
            "vendor/lib/hw/audio.primary.mt6739.so"
            "vendor/lib/libaudiofthalservice.so"
            "vendor/bin/hw/rild"
            "vendor/lib/libmtk-ril.so"
            "vendor/etc/media_codecs.xml"
            "vendor/lib/libion.so"
          )

          # 2. Proses Copy File
          echo "Copying files from dump..."
          for file in "${FILES[@]}"; do
            # Cek di dump_folder/vendor/...
            if [ -f "dump_folder/$file" ]; then
              # Buat subfolder jika perlu (misal vendor/lib/hw)
              DEST_SUBDIR=$(dirname "$file")
              mkdir -p "$PROP_DIR/${DEST_SUBDIR#vendor/}"
              cp "dump_folder/$file" "$PROP_DIR/${DEST_SUBDIR#vendor/}/"
              echo "  [OK] $file"
            else
              echo "  [MISSING] $file"
            fi
          done

          # 3. Generate a02-vendor.mk secara otomatis
          echo "Generating $DEVICE-vendor.mk..."
          cat <<EOF > "$TARGET_DIR/$DEVICE-vendor.mk"
          PRODUCT_COPY_FILES += \\
          EOF

          for file in "${FILES[@]}"; do
            if [ -f "dump_folder/$file" ]; then
              # Format: path/asal:path/tujuan_di_rom
              echo "    $PROP_DIR/${file#vendor/}:$file \\" >> "$TARGET_DIR/$DEVICE-vendor.mk"
            fi
          done

          # 4. Generate BoardConfigVendor.mk
          echo "DEVICE_VENDOR_RELEASE_CONFIG_WILDCARD := vendor/$VENDOR/$DEVICE/configs/*.xml" > "$TARGET_DIR/BoardConfigVendor.mk"

      - name: Commit and Push to Main
        run: |
          git config --global user.name "rdbckp-bot"
          git config --global user.email "rdbckp@users.noreply.github.com"
          
          # Bersihkan sampah
          rm -rf vendor_dump.tar.gz dump_folder
          
          git add .
          
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Manual generate vendor tree A02 [$(date +'%Y%m%d')]"
            git push origin main
          fi
