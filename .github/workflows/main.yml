name: Auto Generate Vendor Tree A02

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vendor Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential curl git libxml2-utils python3

      - name: Setup Tools & Device Tree
        run: |
          # 1. Clone tools ke folder terpisah
          git clone --depth=1 https://github.com/LineageOS/android_vendor_lineage.git $HOME/lineage_tools
          
          # 2. Siapkan folder target
          mkdir -p vendor/samsung/a02

          # 3. Buat proprietary-files.txt
          cat <<EOF > vendor/samsung/a02/proprietary-files.txt
          # Graphics
          vendor/lib/hw/gralloc.mt6739.so
          vendor/lib/hw/hwcomposer.mt6739.so
          vendor/lib/libgralloc_extra.so
          # Audio
          vendor/bin/hw/android.hardware.audio.service
          vendor/lib/hw/audio.primary.mt6739.so
          vendor/lib/libaudiofthalservice.so
          # RIL / Sinyal
          vendor/bin/hw/rild
          vendor/lib/libmtk-ril.so
          # Media & Others
          vendor/etc/media_codecs.xml
          vendor/lib/libion.so
          EOF

          # 4. Buat extract-files.sh (Pake path absolut biar gak pusing)
          cat <<EOF > vendor/samsung/a02/extract-files.sh
          #!/bin/bash
          export DEVICE=a02
          export VENDOR=samsung
          export LINEAGE_ROOT=$GITHUB_WORKSPACE
          
          # Panggil langsung pake path absolut hasil clone tadi
          bash $HOME/lineage_tools/build/tools/extract_utils.sh "\$@"
          EOF

          # 5. Buat setup-makefiles.sh
          cat <<EOF > vendor/samsung/a02/setup-makefiles.sh
          #!/bin/bash
          export DEVICE=a02
          export VENDOR=samsung
          export LINEAGE_ROOT=$GITHUB_WORKSPACE
          
          bash $HOME/lineage_tools/build/tools/setup_makefiles.sh "\$@"
          EOF

          chmod +x vendor/samsung/a02/*.sh

      - name: Download and Unpack Vendor Dump
        run: |
          curl -L "https://github.com/rdbckp/vendor/raw/main/vendor.tar.gz" -o vendor_dump.tar.gz
          mkdir -p dump_folder
          tar -xzpf vendor_dump.tar.gz -C dump_folder/

      - name: Execute Extraction
        run: |
          cd vendor/samsung/a02
          # Jalankan ekstraksi, arahkan ke folder dump
          ./extract-files.sh $GITHUB_WORKSPACE/dump_folder/
          ./setup-makefiles.sh

      - name: Commit and Push to Main
        run: |
          git config --global user.name "rdbckp-bot"
          git config --global user.email "rdbckp@users.noreply.github.com"
          
          # Hapus sampah biar repo gak bengkak
          rm -rf vendor_dump.tar.gz dump_folder
          
          git add .
          
          if git diff-index --quiet HEAD; then
            echo "Gak ada perubahan, skip push."
          else
            git commit -m "Generate vendor tree from A02 dump [$(date +'%Y%m%d')]"
            git push origin main
          fi
