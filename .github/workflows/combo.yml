name: Combo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-combo:
    runs-on: ubuntu-22.04
    steps:
      - name: Brutal Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift /usr/lib/jvm
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 repo libssl-dev rsync

      - name: Initialize LineageOS Source
        run: |
          mkdir -p ~/android
          cd ~/android
          git config --global user.name "rdbckp-bot"
          git config --global user.email "rdbckp@users.noreply.github.com"
          # Init super pelit biar gak sesak napas
          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1 --groups=all,-notdefault,-device,-vts,-pdk

      - name: Sync Sources (Main Only)
        run: |
          cd ~/android
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Manual Clone Trees (Gerilya)
        run: |
          cd ~/android
          rm -rf device/samsung/a02 vendor/samsung/a02 kernel/samsung/a02
          
          # Gunakan GITHUB_TOKEN bawaan biar gak ditanya username/password
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/rdbckp/device_samsung_a02.git -b main device/samsung/a02
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/rdbckp/vendor_a02.git -b main vendor/samsung/a02
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/rdbckp/a022f_kernel.git -b master kernel/samsung/a02

      - name: Build Vendor and Boot
        run: |
          # Pindah ke folder source
          cd ~/android
          
          # Pastikan file envsetup ada sebelum source
          if [ -f build/envsetup.sh ]; then
            export ALLOW_MISSING_DEPENDENCIES=true
            source build/envsetup.sh
            lunch lineage_a02-userdebug
            
            # Masak Boot & Vendor
            make bootimage -j$(nproc --all)
            make vendorimage -j$(nproc --all)
          else
            echo "ERROR: Source code gak ketemu di ~/android"
            ls -a
            exit 1
          fi

      - name: Upload Combo Result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A02_Combo_Pack
          path: |
            /home/runner/android/out/target/product/a02/vendor.img
            /home/runner/android/out/target/product/a02/boot.img
