name: Build Vendor and Boot A02 Fixed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-combo:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift /usr/lib/jvm
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 repo libssl-dev rsync

      - name: Setup Source
        run: |
          # Gunakan path absolut GITHUB_WORKSPACE agar tidak tersesat
          mkdir -p $GITHUB_WORKSPACE/android
          cd $GITHUB_WORKSPACE/android
          git config --global user.name "rdbckp-bot"
          git config --global user.email "rdbckp@users.noreply.github.com"
          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1 --groups=all,-notdefault,-device,-vts,-pdk
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Manual Clone Trees
        run: |
          cd $GITHUB_WORKSPACE/android
          # Gunakan x-access-token untuk menghindari error username/auth
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/rdbckp/device_samsung_a02.git -b main device/samsung/a02
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/rdbckp/vendor_a02.git -b main vendor/samsung/a02
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/rdbckp/a022f_kernel.git -b master kernel/samsung/a02

      - name: Build Boot and Vendor
        run: |
          cd $GITHUB_WORKSPACE/android
          # Pastikan path absolut saat source envsetup
          export ALLOW_MISSING_DEPENDENCIES=true
          source $GITHUB_WORKSPACE/android/build/envsetup.sh
          
          # Pakai lunch sesuai device tree
          lunch lineage_a02-userdebug || lunch lineage_a02-eng
          
          # Masak satu-satu biar ketahuan errornya di mana
          make bootimage -j$(nproc --all)
          make vendorimage -j$(nproc --all)

      - name: Upload Result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A02_Combo_Pack
          path: |
            ${{ github.workspace }}/android/out/target/product/a02/vendor.img
            ${{ github.workspace }}/android/out/target/product/a02/boot.img
