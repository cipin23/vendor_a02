name: A02 Build Combo Super Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift /usr/lib/jvm
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 repo libssl-dev rsync

      - name: Setup and Sync (Babat Alas Mode)
        run: |
          # Bikin folder bener-bener dari nol di Home
          mkdir -p ~/android
          cd ~/android
          
          git config --global user.name "rdbckp-bot"
          git config --global user.email "rdbckp@users.noreply.github.com"
          
          # Init dengan manifest yang bener
          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1
          
          # SYNC SAKTI: Kita paksa dia narik semua folder penting!
          # Kita tambahin -c (current branch) dan --no-tags biar ringan
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --prune
          
          # CEK DETIK INI JUGA: Ada gak foldernya?
          ls -F

      - name: Manual Clone Trees
        run: |
          cd /home/runner/work/build_area
          # Clone ke jalur yang udah pasti ada build/envsetup.sh-nya
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/rdbckp/device_samsung_a02.git -b main device/samsung/a02
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/rdbckp/vendor_a02.git -b main vendor/samsung/a02
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/rdbckp/a022f_kernel.git -b master kernel/samsung/a02

      - name: Build Boot and Vendor (The Real Battle)
        run: |
          cd /home/runner/work/build_area
          
          # Pastikan file sakti itu ada!
          if [ -f build/envsetup.sh ]; then
            export ALLOW_MISSING_DEPENDENCIES=true
            source build/envsetup.sh
            lunch lineage_a02-userdebug
            
            # Masak Boot & Vendor
            make bootimage -j$(nproc --all)
            make vendorimage -j$(nproc --all)
          else
            echo "DEUHHHH! Masih gak ada juga build/envsetup.sh-nya!"
            find . -maxdepth 2 -not -path '*/.*'
            exit 1
          fi

      - name: Upload Result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A02_Combo_Pack_Final
          path: |
            /home/runner/work/build_area/out/target/product/a02/vendor.img
            /home/runner/work/build_area/out/target/product/a02/boot.img
