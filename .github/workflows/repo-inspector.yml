name: Vendor Repo Inspector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Basic Information
        run: |
          mkdir report

          {
            echo "===== DATE ====="
            date

            echo
            echo "===== GITHUB ====="
            echo "Repository : $GITHUB_REPOSITORY"
            echo "Branch     : $GITHUB_REF_NAME"
            echo "Workspace  : $GITHUB_WORKSPACE"

            echo
            echo "===== ROOT ====="
            pwd

          } > report/info.txt

      - name: Full Directory Tree
        run: |
          sudo apt-get update
          sudo apt-get install -y tree

          tree -a -L 8 > report/tree.txt || true

      - name: Find Important Files
        run: |
          {
            echo "===== Android.bp ====="
            find . -name Android.bp

            echo
            echo "===== Android.mk ====="
            find . -name Android.mk

            echo
            echo "===== BoardConfigVendor.mk ====="
            find . -name BoardConfigVendor.mk

            echo
            echo "===== AndroidProducts.mk ====="
            find . -name AndroidProducts.mk

            echo
            echo "===== proprietary-files.txt ====="
            find . -name proprietary-files.txt

            echo
            echo "===== extract-files.sh ====="
            find . -name extract-files.sh

            echo
            echo "===== extract-files.py ====="
            find . -name extract-files.py

            echo
            echo "===== setup-makefiles.sh ====="
            find . -name setup-makefiles.sh

            echo
            echo "===== proprietary ====="
            find . -type d -name proprietary

          } > report/files.txt

      - name: Detect Vendor Structure
        run: |
          {
            echo "===== DEVICE DIRECTORIES ====="
            find . -maxdepth 4 -type d

            echo
            echo "===== FILE COUNT ====="
            find . -type f | wc -l

            echo
            echo "===== DIRECTORY COUNT ====="
            find . -type d | wc -l

          } > report/layout.txt

      - name: Detect Proprietary Files
        run: |
          {
            echo "===== BLOBS ====="

            find . \
            \( \
              -name "*.so" -o \
              -name "*.apk" -o \
              -name "*.jar" -o \
              -name "*.xml" -o \
              -name "*.bin" -o \
              -name "*.rc" -o \
              -name "*.conf" -o \
              -name "*.json" -o \
              -name "*.ko" \
            \)

          } > report/blobs.txt

      - name: Detect Existing PRODUCT_COPY_FILES
        run: |
          grep -R "PRODUCT_COPY_FILES" . > report/product_copy_files.txt || true

      - name: Detect PRODUCT_PACKAGES
        run: |
          grep -R "PRODUCT_PACKAGES" . > report/product_packages.txt || true

      - name: Detect LOCAL_PATH
        run: |
          grep -R "LOCAL_PATH" . > report/local_path.txt || true

      - name: Detect Blueprint Modules
        run: |
          grep -R "cc_prebuilt_library_shared" . > report/blueprint.txt || true

      - name: Show Repository Size
        run: |
          du -sh . > report/size.txt

      - name: Git Status
        run: |
          {
            git status
            echo
            git branch
            echo
            git remote -v
          } > report/git.txt

      - name: Compress Report
        run: |
          tar -czf vendor_repo_report.tar.gz report

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: vendor_repo_report
          path: |
            report/
            vendor_repo_report.tar.gz
