name: repo-inspector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tree
        run: sudo apt-get update && sudo apt-get install -y tree

      - name: Detect repository
        run: bash scripts/detect_repo.sh

      - name: Scan blobs
        run: bash scripts/scan_blobs.sh

      - name: Create inspection report
        run: |
          mkdir -p report

          {
            echo "===== DATE ====="
            date

            echo
            echo "===== GITHUB ====="
            echo "Repository : $GITHUB_REPOSITORY"
            echo "Branch     : $GITHUB_REF_NAME"
            echo "Workspace  : $GITHUB_WORKSPACE"

            echo
            echo "===== ROOT ====="
            pwd
          } > report/info.txt

          tree -a -L 8 > report/tree.txt || true

          {
            echo "===== Android.bp ====="
            find . -name Android.bp || true

            echo
            echo "===== Android.mk ====="
            find . -name Android.mk || true

            echo
            echo "===== BoardConfigVendor.mk ====="
            find . -name BoardConfigVendor.mk || true

            echo
            echo "===== AndroidProducts.mk ====="
            find . -name AndroidProducts.mk || true

            echo
            echo "===== proprietary-files.txt ====="
            find . -name proprietary-files.txt || true

            echo
            echo "===== proprietary ====="
            find . -type d -name proprietary || true
          } > report/files.txt

          {
            echo "===== BLOBS ====="
            find . \( -name "*.so" -o -name "*.apk" -o -name "*.jar" -o -name "*.xml" -o -name "*.bin" -o -name "*.rc" -o -name "*.conf" -o -name "*.json" -o -name "*.ko" \) || true
          } > report/blobs.txt

          grep -R "PRODUCT_COPY_FILES" . > report/product_copy_files.txt || true
          grep -R "PRODUCT_PACKAGES" . > report/product_packages.txt || true
          grep -R "LOCAL_PATH" . > report/local_path.txt || true
          grep -R "cc_prebuilt_library_shared" . > report/blueprint.txt || true
          du -sh . > report/size.txt

          {
            git status
            echo
            git branch
            echo
            git remote -v
          } > report/git.txt

          tar -czf vendor_repo_report.tar.gz report

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: vendor_repo_report
          path: |
            report/
            vendor_repo_report.tar.gz

