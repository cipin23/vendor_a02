name: Auto Generate Vendor Tree A02 (Sapu Jagat Fixed)

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vendor Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Download and Unpack Vendor Dump
        run: |
          curl -L "https://github.com/rdbckp/vendor/raw/main/vendor.tar.gz" -o vendor_dump.tar.gz
          mkdir -p dump_folder
          tar -xzpf vendor_dump.tar.gz -C dump_folder/

      - name: Sapu Jagat Extraction & Makefile Generator
        run: |
          DEVICE=a02
          VENDOR=samsung
          TARGET_DIR="vendor/$VENDOR/$DEVICE"
          PROP_DIR="$TARGET_DIR/proprietary"
          
          # Bersihkan folder lama
          rm -rf "$PROP_DIR"
          mkdir -p "$PROP_DIR"
          touch "$PROP_DIR/.gitkeep"

          echo "--- MEMULAI EKSTRAKSI SELURUH FILE ---"
          
          # Cari folder 'vendor' di dalam dump
          DUMP_VENDOR_PATH=$(find dump_folder -type d -name "vendor" | head -n 1)
          
          if [ -z "$DUMP_VENDOR_PATH" ]; then
            echo "Folder vendor gak ketemu di dump, pake root dump_folder"
            DUMP_VENDOR_PATH="dump_folder"
          fi

          # Ambil SEMUA file
          cd "$DUMP_VENDOR_PATH"
          find . -type f | while read -r file; do
            # Bersihkan prefix './'
            REL_PATH="${file#./}"
            
            # Lewati file yang gak penting
            if [[ "$REL_PATH" == *"lost+found"* ]]; then 
                continue
            fi

            # Buat folder tujuan di repo
            mkdir -p "$GITHUB_WORKSPACE/$PROP_DIR/$(dirname "$REL_PATH")"
            
            # Copy filenya
            cp "$REL_PATH" "$GITHUB_WORKSPACE/$PROP_DIR/$REL_PATH"
            echo "  [OK] Copied: $REL_PATH"
          done

          echo "--- GENERATING MAKEFILES ---"
          cd "$GITHUB_WORKSPACE"
          
          # Generate a02-vendor.mk
          {
            echo "# Auto-generated by Sapu Jagat Mode. DO NOT MODIFY."
            echo "PRODUCT_COPY_FILES += \\"
            
            # List semua file (filter .gitkeep agar tidak masuk makefile)
            find "$PROP_DIR" -type f ! -name ".gitkeep" | while read -r f; do
                # Bersihkan path untuk makefile
                # Contoh: vendor/samsung/a02/proprietary/lib/abc.so -> vendor/lib/abc.so
                CLEAN_PATH=${f#$PROP_DIR/}
                echo "    $f:vendor/$CLEAN_PATH \\"
            done
          } > "$TARGET_DIR/$DEVICE-vendor.mk"

          # Generate BoardConfigVendor.mk
          echo "DEVICE_VENDOR_RELEASE_CONFIG_WILDCARD := vendor/$VENDOR/$DEVICE/configs/*.xml" > "$TARGET_DIR/BoardConfigVendor.mk"

      - name: Commit and Push to Main
        run: |
          git config --global user.name "rdbckp-bot"
          git config --global user.email "rdbckp@users.noreply.github.com"
          
          # Hapus sampah
          rm -rf vendor_dump.tar.gz dump_folder
          
          git add .
          
          if git diff-index --quiet HEAD; then
            echo "Gak ada perubahan."
          else
            git commit -m "Sapu Jagat Fixed: Generate 100% vendor tree A02 [$(date +'%Y%m%d')]"
            git push origin main
          fi
