name: Auto Generate Vendor Tree A02 (Root Force Mode)

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vendor Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Download and Unpack Vendor Dump
        run: |
          curl -L "https://github.com/rdbckp/vendor/raw/main/vendor.tar.gz" -o vendor_dump.tar.gz
          mkdir -p dump_folder
          # Gunakan sudo saat ekstrak agar permission asli dump gak nge-lock runner
          sudo tar -xzpf vendor_dump.tar.gz -C dump_folder/
          # Paksa buka akses semua file agar bisa dibaca skrip
          sudo chmod -R 777 dump_folder/

      - name: Sapu Jagat Extraction & Makefile Generator
        run: |
          DEVICE=a02
          VENDOR=samsung
          TARGET_DIR="vendor/$VENDOR/$DEVICE"
          PROP_DIR="$TARGET_DIR/proprietary"
          
          rm -rf "$PROP_DIR"
          mkdir -p "$PROP_DIR"
          touch "$PROP_DIR/.gitkeep"

          echo "--- MEMULAI EKSTRAKSI (ROOT FORCE) ---"
          
          DUMP_VENDOR_PATH=$(find dump_folder -type d -name "vendor" | head -n 1)
          
          if [ -z "$DUMP_VENDOR_PATH" ]; then
            DUMP_VENDOR_PATH="dump_folder"
          fi

          cd "$DUMP_VENDOR_PATH"
          # Cari semua file dan copy pake sudo
          find . -type f | while read -r file; do
            REL_PATH="${file#./}"
            
            if [[ "$REL_PATH" == *"lost+found"* ]]; then 
                continue
            fi

            mkdir -p "$GITHUB_WORKSPACE/$PROP_DIR/$(dirname "$REL_PATH")"
            
            # Pake sudo buat copy file yang permission-nya kekunci
            sudo cp "$REL_PATH" "$GITHUB_WORKSPACE/$PROP_DIR/$REL_PATH"
            # Balikin kepemilikan ke user runner biar bisa di-push ke git
            sudo chown runner:docker "$GITHUB_WORKSPACE/$PROP_DIR/$REL_PATH"
            echo "  [OK] Copied: $REL_PATH"
          done

          echo "--- GENERATING MAKEFILES ---"
          cd "$GITHUB_WORKSPACE"
          
          {
            echo "# Auto-generated by Sapu Jagat Mode. DO NOT MODIFY."
            echo "PRODUCT_COPY_FILES += \\"
            
            find "$PROP_DIR" -type f ! -name ".gitkeep" | while read -r f; do
                CLEAN_PATH=${f#$PROP_DIR/}
                echo "    $f:vendor/$CLEAN_PATH \\"
            done
          } > "$TARGET_DIR/$DEVICE-vendor.mk"

          echo "DEVICE_VENDOR_RELEASE_CONFIG_WILDCARD := vendor/$VENDOR/$DEVICE/configs/*.xml" > "$TARGET_DIR/BoardConfigVendor.mk"

      - name: Commit and Push to Main
        run: |
          git config --global user.name "rdbckp-bot"
          git config --global user.email "rdbckp@users.noreply.github.com"
          
          sudo rm -rf vendor_dump.tar.gz dump_folder
          
          git add .
          
          if git diff-index --quiet HEAD; then
            echo "Gak ada perubahan."
          else
            git commit -m "Sapu Jagat: Root Force Extraction [$(date +'%Y%m%d')]"
            git push origin main
          fi
