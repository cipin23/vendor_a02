name: Auto Generate Vendor Tree A02 Final

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vendor Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Download and Unpack Vendor Dump
        run: |
          curl -L "https://github.com/rdbckp/vendor/raw/main/vendor.tar.gz" -o vendor_dump.tar.gz
          mkdir -p dump_folder
          sudo tar -xzpf vendor_dump.tar.gz -C dump_folder/
          sudo chmod -R 777 dump_folder/

      - name: Sapu Jagat Extraction & Makefile Generator
        run: |
          DEVICE=a02
          VENDOR=samsung
          TARGET_DIR="vendor/$VENDOR/$DEVICE"
          PROP_DIR="$TARGET_DIR/proprietary"
          
          rm -rf "$PROP_DIR"
          mkdir -p "$PROP_DIR"
          touch "$PROP_DIR/.gitkeep"

          echo "--- MEMULAI EKSTRAKSI ---"
          DUMP_VENDOR_PATH=$(find dump_folder -type d -name "vendor" | head -n 1)
          [ -z "$DUMP_VENDOR_PATH" ] && DUMP_VENDOR_PATH="dump_folder"

          cd "$DUMP_VENDOR_PATH"
          find . -type f | while read -r file; do
            REL_PATH="${file#./}"
            [[ "$REL_PATH" == *"lost+found"* ]] && continue
            mkdir -p "$GITHUB_WORKSPACE/$PROP_DIR/$(dirname "$REL_PATH")"
            sudo cp "$REL_PATH" "$GITHUB_WORKSPACE/$PROP_DIR/$REL_PATH"
            sudo chown runner:docker "$GITHUB_WORKSPACE/$PROP_DIR/$REL_PATH"
          done

          echo "--- GENERATING MAKEFILES ---"
          cd "$GITHUB_WORKSPACE"
          
          # 1. Generate a02-vendor.mk
          printf "# Auto-generated by Sapu Jagat.\n" > "$TARGET_DIR/$DEVICE-vendor.mk"
          printf "PRODUCT_COPY_FILES += \\\\\n" >> "$TARGET_DIR/$DEVICE-vendor.mk"
          find "$PROP_DIR" -type f ! -name ".gitkeep" | while read -r f; do
              CLEAN_PATH=${f#$PROP_DIR/}
              printf "    %s:vendor/%s \\\\\n" "$f" "$CLEAN_PATH" >> "$TARGET_DIR/$DEVICE-vendor.mk"
          done

          # 2. Generate Android.mk
          printf "LOCAL_PATH := \$(call my-dir)\n" > "$TARGET_DIR/Android.mk"
          printf "ifeq (\$(TARGET_DEVICE),%s)\n" "$DEVICE" >> "$TARGET_DIR/Android.mk"
          printf "include \$(LOCAL_PATH)/%s-vendor.mk\n" "$DEVICE" >> "$TARGET_DIR/Android.mk"
          printf "endif\n" >> "$TARGET_DIR/Android.mk"

          # 3. Generate AndroidProducts.mk
          printf "PRODUCT_MAKEFILES := \\\\\n" > "$TARGET_DIR/AndroidProducts.mk"
          printf "    \$(LOCAL_DIR)/%s-vendor.mk\n" "$DEVICE" >> "$TARGET_DIR/AndroidProducts.mk"

          # 4. Generate BoardConfigVendor.mk
          printf "DEVICE_VENDOR_RELEASE_CONFIG_WILDCARD := vendor/%s/%s/configs/*.xml\n" "$VENDOR" "$DEVICE" > "$TARGET_DIR/BoardConfigVendor.mk"

      - name: Commit and Push to Main
        run: |
          git config --global user.name "rdbckp-bot"
          git config --global user.email "rdbckp@users.noreply.github.com"
          sudo rm -rf vendor_dump.tar.gz dump_folder
          git add .
          if git diff-index --quiet HEAD; then
            echo "No changes"
          else
            git commit -m "Final Fix Ijo: Pro Mode Vendor Tree A02"
            git push origin main
          fi
